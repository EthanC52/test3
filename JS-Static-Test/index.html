<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoinVertible Monitor</title>
  <meta name="description" content="Total supply EURCV et USDCV et incentives du vault Morpho, lus on-chain en temps réel." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='8' fill='%23E9041E'/%3E%3Crect y='8' width='16' height='8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Styles intégrés : la page ne dépend d'aucun fichier CSS séparé -->
  <style>
:root {
  --red: #e9041e;
  --red-ink: #c10017;
  --black: #000;
  --white: #fff;
  --paper: #f5f5f3;
  --line: #d9d9d6;
  --ink: #1a1a1a;
  --ink-2: #5c5c5c;
  --pos: #0b6e3f;
  --display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --text: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--white);
  color: var(--ink);
  font: 400 16px/1.5 var(--text);
  font-variant-numeric: tabular-nums;
}
a { color: inherit; text-decoration-color: var(--red); text-underline-offset: 3px; }
a:hover { color: var(--red-ink); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
code { font-size: 0.9em; background: var(--paper); padding: 0.05em 0.3em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.err { color: var(--red-ink); }
.pos { color: var(--pos); }
.neg { color: var(--red-ink); }
.r { text-align: right; }

/* ───────── Barre haute ───────── */
.topbar { background: var(--black); color: var(--white); border-top: 4px solid var(--red); }
.topbar-inner {
  max-width: 1240px; margin: 0 auto; padding: 14px var(--gutter);
  display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
}
.brand-name { font: 800 1.15rem/1.1 var(--display); letter-spacing: -0.01em; }
.brand-sub { color: #b9b9b9; font-size: 0.875rem; }
.topbar-status { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 0.875rem; }
.topbar-meta { color: #b9b9b9; }
.live-pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
.live-pill .dot { margin-right: 0; }
.dot-live { background: var(--red); box-shadow: 0 0 0 0 rgba(233, 4, 30, 0.6); animation: pulse 2s infinite; }
.dot-stale { background: #9a9a9a; }
.dot-error { background: transparent; box-shadow: inset 0 0 0 2px var(--red); }
.dot-wait { background: #cfcfcf; }
.dot-off { background: transparent; box-shadow: inset 0 0 0 1px #9a9a9a; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 4, 30, 0.55); } 70% { box-shadow: 0 0 0 7px rgba(233, 4, 30, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 4, 30, 0); } }

.btn-ghost {
  font: 600 0.875rem var(--text); color: var(--white); background: transparent;
  border: 1px solid #5a5a5a; padding: 7px 14px; cursor: pointer;
}
.btn-ghost:hover { border-color: var(--white); }
.btn-ghost.dark { color: var(--ink); border-color: var(--line); }
.btn-ghost.dark:hover { border-color: var(--ink); }
.btn-primary { font: 700 0.9rem var(--text); color: var(--white); background: var(--red); border: 0; padding: 9px 16px; cursor: pointer; }
.btn-primary:hover { background: var(--red-ink); }
.btn-link { font: 600 0.875rem var(--text); background: none; border: 0; color: var(--red-ink); cursor: pointer; text-decoration: underline; padding: 0; }

/* ───────── Mise en page ───────── */
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px var(--gutter) 56px; }
.tokens { display: grid; grid-template-columns: 1fr; gap: 32px; }
@media (min-width: 920px) { .tokens { grid-template-columns: 1fr 1fr; } }

/* ───────── Panneau supply : le split rouge / noir ───────── */
.split {
  position: relative; color: var(--white);
  background: linear-gradient(to bottom, var(--red) 0 50%, var(--black) 50% 100%);
  min-height: 248px; display: grid; grid-template-rows: 1fr auto 1fr;
}
.split-top { padding: 20px 24px 0; }
.token-sym { margin: 0; font: 800 1.6rem/1 var(--display); letter-spacing: -0.01em; }
.token-name { margin: 4px 0 0; font-size: 0.95rem; opacity: 0.92; }
.split-figure { padding: 0 20px; }
.hero-num {
  display: block; font: 700 clamp(2rem, 6.2vw, 3.5rem)/1 var(--display); letter-spacing: -0.03em;
  white-space: nowrap; overflow: hidden; text-overflow: clip;
}
@media (min-width: 920px) { .hero-num { font-size: clamp(2rem, 3.2vw, 3.3rem); } }
.hero-num .num-dec { font-size: 0.5em; font-weight: 600; letter-spacing: 0; margin-left: 2px; opacity: 0.75; }
.split-bottom {
  align-self: end; padding: 0 24px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px;
  font-size: 0.875rem; color: #cfcfcf;
}

.num { transition: color 0.9s ease; }
.num.flash-up { color: #3ddc84; transition: none; }
.num.flash-down { color: #ff6b7d; transition: none; }
.chains .num.flash-up, .facts .num.flash-up, .adapters .num.flash-up { color: var(--pos); }
.chains .num.flash-down, .facts .num.flash-down, .adapters .num.flash-down { color: var(--red); }

/* ───────── Tables ───────── */
table { width: 100%; border-collapse: collapse; }
.chains { margin-top: 4px; }
.chains th, .chains td, .adapters th, .adapters td, .dyn-table th, .dyn-table td {
  padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400;
}
.chains thead th, .adapters thead th { font-size: 0.8125rem; color: var(--ink-2); font-weight: 600; padding-top: 14px; }
.chains .r, .adapters .r, .dyn-table .r { text-align: right; }
.chains tbody th { white-space: nowrap; }
.chains td.r .num { white-space: nowrap; }
.chains tbody th { font-weight: 600; }
.chains .st-off { color: var(--ink-2); }
.share { white-space: nowrap; width: 9.5em; }
@media (max-width: 520px) { .share { width: auto; } .chains th, .chains td { font-size: 0.9375rem; } }
.bar { display: inline-block; width: 56px; height: 4px; background: var(--paper); vertical-align: middle; margin-right: 8px; }
.bar > span { display: block; height: 100%; background: var(--black); }
.token-foot { margin: 12px 0 0; font-size: 0.9rem; color: var(--ink-2); }
.token-foot strong { font-weight: 700; }

/* ───────── Vault ───────── */
.vault { margin-top: 56px; border-top: 4px solid var(--black); padding-top: 22px; }
.vault-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: flex-start; }
.vault-head h2 { margin: 0; font: 800 clamp(1.35rem, 2.6vw, 1.75rem)/1.2 var(--display); letter-spacing: -0.015em; max-width: 30ch; }
.vault-sub { margin: 6px 0 0; color: var(--ink-2); font-size: 0.95rem; }
.vault-links { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 0.9rem; font-weight: 600; padding-top: 4px; }
.empty { margin-top: 20px; color: var(--ink-2); }

.incentive { display: grid; gap: 24px; margin-top: 28px; grid-template-columns: 1fr; }
@media (min-width: 920px) { .incentive { grid-template-columns: 1.35fr 1fr; align-items: center; } }
.incentive-label { margin: 0; font-weight: 600; font-size: 1rem; }
.incentive-fig { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.big-num { font: 800 clamp(2.4rem, 6.6vw, 4.6rem)/1 var(--display); letter-spacing: -0.035em; color: var(--red); }
.big-num .num-dec { font-size: 0.45em; font-weight: 700; letter-spacing: 0; }
.big-num.flash-up { color: var(--pos); }
.big-num.flash-down { color: var(--red-ink); }
.unit { font: 700 1.1rem var(--display); }
.incentive-formula { margin: 10px 0 0; color: var(--ink-2); }
.incentive-formula strong { color: var(--ink); font-weight: 600; }
.incentive-side { display: grid; gap: 0; border-left: 1px solid var(--line); }
@media (max-width: 919px) { .incentive-side { border-left: 0; border-top: 1px solid var(--line); } }
.kpi { display: grid; gap: 2px; padding: 12px 0 12px 20px; }
@media (max-width: 919px) { .kpi { padding-left: 0; } }
.kpi + .kpi { border-top: 1px solid var(--line); }
.kpi-label { font-size: 0.875rem; color: var(--ink-2); }
.kpi-val { font: 700 1.35rem/1.25 var(--display); }
.kpi-hint { font-size: 0.875rem; color: var(--ink-2); }

.stack { display: flex; margin-top: 28px; height: 40px; font-size: 0.8125rem; font-weight: 600; color: var(--white); }
.stack > span { display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; }
.stack > span > span { padding: 0 12px; }
.stack-a { background: var(--black); }
.stack-b { background: var(--red); min-width: 6px !important; }
.stack-b > span { position: relative; }
@media (max-width: 640px) { .stack-b > span { display: none; } }

.vault-grid { display: grid; grid-template-columns: 1fr; gap: 32px 48px; margin-top: 32px; }
@media (min-width: 920px) { .vault-grid { grid-template-columns: 1.35fr 1fr; } }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 28px; }
.fact { padding: 12px 0; border-top: 1px solid var(--line); }
.fact dt { font-size: 0.875rem; color: var(--ink-2); }
.fact dd { margin: 2px 0 0; font: 700 1.15rem/1.3 var(--display); }
.fact dd .num-dec { font-weight: 600; }
.fact-hint { margin: 2px 0 0; font-size: 0.8125rem; color: var(--ink-2); }

.dyn h3 { margin: 0 0 4px; font: 700 1.05rem var(--display); }
.dyn h3 + p, .dyn h3 + ul { margin-top: 6px; }
.dyn-table { margin-bottom: 10px; }
.dyn-table th { color: var(--ink-2); }
.dyn-table td { font-weight: 600; white-space: nowrap; }
.dyn-note { margin: 0 0 24px; font-size: 0.875rem; color: var(--ink-2); max-width: 60ch; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.events li span { color: var(--ink-2); }

.adapters { margin-top: 36px; }
.adapters caption { text-align: left; font: 700 1.05rem var(--display); padding-bottom: 4px; }
.adapters tbody th a { font-weight: 600; }

.method { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; max-width: 80ch; }
.method summary { cursor: pointer; font-weight: 700; }
.method ol { padding-left: 1.2em; }
.method li { margin: 6px 0; }

/* ───────── Pied de page ───────── */
.foot { background: var(--black); color: #cfcfcf; }
.foot-inner { max-width: 1240px; margin: 0 auto; padding: 32px var(--gutter) 40px; display: grid; gap: 24px; }
@media (min-width: 920px) { .foot-inner { grid-template-columns: 1.4fr 1fr; } }
.foot h2 { margin: 0 0 10px; font: 700 1rem var(--display); color: var(--white); }
.addr { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 24px; font-size: 0.875rem; }
.addr li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #2c2c2c; padding: 5px 0; }
.addr a { color: var(--white); }
.foot-note { margin: 0; font-size: 0.8125rem; max-width: 55ch; align-self: end; }

/* ───────── Dialogue réglages ───────── */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--white); width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; border-top: 4px solid var(--red); }
.dialog h2 { margin: 0 0 6px; font: 800 1.3rem var(--display); }
.dialog-intro { margin: 0 0 16px; color: var(--ink-2); font-size: 0.95rem; }
.net-field { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 12px 0; }
.net-field legend { display: contents; }
.net-field legend .muted { display: block; font-size: 0.8125rem; margin: 2px 0 6px; overflow-wrap: anywhere; }
.switch { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer; }
.switch input { accent-color: var(--red); width: 16px; height: 16px; }
textarea, input[type="number"] {
  width: 100%; font: 400 0.875rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  border: 1px solid var(--line); padding: 8px; resize: vertical; background: var(--white); color: var(--ink);
}
textarea:focus, input:focus { border-color: var(--black); outline: none; }
.interval { display: grid; gap: 6px; font-weight: 600; margin-top: 12px; max-width: 220px; }
.dialog-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.spacer { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  .dot-live { animation: none; }
  .num { transition: none; }
}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React sans étape de build : la page se déploie telle quelle sur GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js" crossorigin></script>

  <!-- Ta configuration (RPC, adresses, vault) -->
  <script src="./config.js"></script>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
